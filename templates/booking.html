<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <title>Book a Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
</head>
<body>
  <!-- Header -->
  <header class="p-3 bg-primary text-white border-bottom mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">Book a Service</h1>
      <nav>
        <a href="{{ url_for('home') }}" class="me-3 text-white text-decoration-none">Home</a>
        <a href="{{ url_for('services') }}" class="text-white text-decoration-none">Services</a>
      </nav>
    </div>
  </header>

  <!-- Main Booking Form -->
  <main class="container">
    <form id="bookingForm" class="card p-4 shadow-sm" novalidate>
      {% if selected_worker %}
        <!-- LOCKED BOOKING -->
        <div class="alert alert-info">
          You have selected a specific worker.
          The booking will be <strong>locked</strong> to this worker.
        </div>

        <!-- Department (read-only) -->
        <div class="mb-3">
          <label class="form-label">Department</label>

          <!-- Visible -->
          <input type="text"
                class="form-control"
                value="{{ selected_department_name }}"
                readonly>

          <!-- Hidden for JS & backend -->
          <input type="hidden"
                id="department"
                name="department"
                value="{{ selected_department_name }}">
        </div>

        <!-- Worker -->
        <div class="mb-3">
          <label class="form-label">Selected Worker</label>

          <input type="text"
                class="form-control"
                value="{{ selected_worker.name }}"
                readonly>

          <input type="hidden"
                id="worker_id"
                value="{{ selected_worker.id }}">
        </div>

      {% else %}
        <!-- EMERGENCY BOOKING -->
        <div class="alert alert-warning">
          <strong>Urgent booking:</strong>
          A nearby available worker will be automatically assigned.
        </div>

        <div class="mb-3">
          <label class="form-label">Select Department</label>
          <select id="department"
                  class="form-select"
                  required>
            <option value="" disabled selected>
              --Choose a department--
            </option>
            {% for d in departments %}
              <option value="{{ d.name }}">{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
      {% endif %}

      <!-- Date -->
      <div class="mb-3">
        <label for="date" class="form-label">Select Date:</label>
        <input type="date" id="date" class="form-control" required>
      </div>

      <!-- Time -->
      <div class="mb-3">
        <label class="form-label">Select Time:</label>
        <div class="d-flex">
          <select id="timeHour" class="form-select me-2" required>
            <option value="" disabled selected>Hour</option>
            {% for h in range(1,13) %}
              <option value="{{ h }}">{{ "%02d"|format(h) }}</option>
            {% endfor %}
          </select>

          <select id="timeMinute" class="form-select me-2" required>
            <option value="" disabled selected>Min</option>
            {% for m in range(0,60) %}
              <option value="{{ "%02d"|format(m) }}">{{ "%02d"|format(m) }}</option>
            {% endfor %}
          </select>

          <select id="timeAMPM" class="form-select" required>
            <option value="" disabled selected>AM/PM</option>
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
      </div>

      <!-- Contact -->
      <div class="mb-3">
        <label for="contact" class="form-label">Contact Info:</label>
        <input type="text" id="contact" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary">Book Now</button>
    </form>

  </main>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index: 1055;"></div>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/booking.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
