<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Bookings</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container py-4">

    <!-- TITLE -->
    <h2 class="text-center mb-4">
        My Bookings
    </h2>

    <!-- ALERT -->
    <div id="alert-container"></div>

    <!-- TABLE -->
    <div class="table-responsive">

        <table
            class="table table-bordered table-striped"
            id="bookings-table">

            <thead class="table-dark">

                <tr>

                    <th>#</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Worker</th>
                    <th>Contact</th>
                    <th>Fee</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="bookings-body">

                <!-- DATA -->

            </tbody>

        </table>

    </div>

</div>


<!-- REVIEW MODAL -->
<div class="modal fade"
     id="reviewModal"
     tabindex="-1">
    
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- HEADER -->
            <div class="modal-header">
                <h5 class="modal-title">
                    Submit Review
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <!-- IMPORTANT -->
            <form id="reviewForm">
                <div class="modal-body">
                    <input
                        type="hidden"
                        id="review_booking_id">
                    <input
                        type="hidden"
                        id="review_worker_id">
                    <!-- RATING -->
                    <div class="mb-3">
                        <label class="form-label">
                            Rating
                        </label>
                        <select
                            id="rating"
                            class="form-select">
                            <option value="5">
                                ⭐⭐⭐⭐⭐ 5 Star
                            </option>
                            <option value="4">
                                ⭐⭐⭐⭐ 4 Star
                            </option>
                            <option value="3">
                                ⭐⭐⭐ 3 Star
                            </option>
                            <option value="2">
                                ⭐⭐ 2 Star
                            </option>
                            <option value="1">
                                ⭐ 1 Star
                            </option>
                        </select>
                    </div>
                    <!-- REVIEW -->
                    <div class="mb-3">
                        <label class="form-label">
                            Review
                        </label>
                        <textarea
                            id="review"
                            class="form-control"
                            rows="4"
                            placeholder="Write your review...">
                        </textarea>
                    </div>
                </div>

                <!-- FOOTER -->
                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Close
                    </button>
                    <button
                        type="submit"
                        class="btn btn-success">
                        Submit Review
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- YOUR JS -->
<script src="{{ url_for('static', filename='js/user_bookings.js') }}"></script>

</body>
</html>
