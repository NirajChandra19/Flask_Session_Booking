<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ department.name }} Workers</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/services.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/service_workers.css') }}" />
</head>

<body class="bg-light">

    <!-- TOP HEADING -->
    <!-- <div class="container">
    <div class="available-workers-header mb-3">
        <h2 class="fw-bold text-center mb-0">
        Available Workers
        </h2>
    </div>
    </div> -->

    <div class="container">
        <div class="top-bar">
            <div class="heading-container">
                <h1 class="main-heading">Available Workers</h1>
            </div>
        </div>
    </div>

    <div class="container py-5">

        {% if workers %}
            <!-- Workers Row -->
            <div class="d-flex gap-4 overflow-auto pb-3">
                {% for w in workers %}
                    <div class="card worker-card shadow-sm">
                        <div class="card-body text-center">

                            {% if w.image %}
                            <img src="{{ url_for('static', filename='profile_photos/worker_photos/' + w.image) }}"
                                class="rounded-circle mb-3 worker-img"
                                alt="{{ w.name }}">
                            {% else %}
                            <div class="rounded-circle bg-secondary mb-3 mx-auto worker-img"></div>
                            {% endif %}

                            <h5 class="fw-semibold mb-1">{{ w.name }}</h5>

                            <p class="text-primary fw-bold mb-1">
                            ₹ {{ w.fee }}
                            </p>

                            <p class="small text-muted mb-3">
                            {{ w.about }}
                            </p>

                            <!-- PASS WORKER ID -->
                            <a href="{{ url_for('book_service_page') }}?department_name={{ department.name }}&worker_id={{ w.id }}"
                            class="btn btn-primary btn-sm px-4">
                            Book
                            </a>

                        </div>
                    </div>
                {% endfor %}

            </div>
        {% else %}
        <!-- No Workers -->
        <p class="text-danger mt-3">
            No workers available.
        </p>
        {% endif %}

    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {

    const workersRow = document.querySelector('.d-flex.gap-4');

    // 1️⃣ Enable smooth horizontal scrolling
    if (workersRow) {
        workersRow.style.scrollBehavior = 'smooth';
    }

    // 2️⃣ Add swipe hint for mobile users
    if (window.innerWidth <= 576 && workersRow) {
        const hint = document.createElement('div');
        hint.textContent = '← Swipe to see more workers →';
        hint.className = 'text-center text-muted small mb-3';

        workersRow.parentNode.insertBefore(hint, workersRow);

        // Auto-hide hint after 4 seconds
        setTimeout(() => {
        hint.remove();
        }, 4000);
    }

    // 3️⃣ Prevent image dragging (better mobile UX)
    document.querySelectorAll('img').forEach(img => {
        img.setAttribute('draggable', 'false');
    });

    });
    </script>

</body>
</html>
